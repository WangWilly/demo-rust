<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rust 智慧指標 Box / Rc / Arc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.27.1/babel.min.js"></script>
</head>
<body class="bg-[#f8fafc] min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function SvgIcon({ size = 24, className = '', children, ...props }) {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2"
          strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
          {children}
        </svg>
      );
    }
    const Play       = (p) => <SvgIcon {...p}><polygon points="5 3 19 12 5 21 5 3"/></SvgIcon>;
    const StepForward= (p) => <SvgIcon {...p}><line x1="6" x2="6" y1="4" y2="20"/><polygon points="10 4 20 12 10 20 10 4"/></SvgIcon>;
    const StepBack   = (p) => <SvgIcon {...p}><line x1="18" x2="18" y1="20" y2="4"/><polygon points="14 20 4 12 14 4 14 20"/></SvgIcon>;
    const RotateCcw  = (p) => <SvgIcon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></SvgIcon>;
    const Box        = (p) => <SvgIcon {...p}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></SvgIcon>;
    const Share2     = (p) => <SvgIcon {...p}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></SvgIcon>;
    const Activity   = (p) => <SvgIcon {...p}><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></SvgIcon>;
    const Layers     = (p) => <SvgIcon {...p}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></SvgIcon>;
    const Database   = (p) => <SvgIcon {...p}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></SvgIcon>;
    const ArrowRight = (p) => <SvgIcon {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></SvgIcon>;

    const SCENARIOS = [
      {
        id: 'box',
        title: 'Box<T>：單一擁有權的堆積分配',
        description: 'Box 是最簡單的智慧指標。它將資料從 Stack (堆疊) 搬到 Heap (堆積)，並在 Stack 上留下一個指標。它依然遵守「單一擁有權」規則，可以發生 Move (轉移)。',
        code: [
          "fn main() {",
          "    // b 被分配在 Stack，但它的資料 (5) 在 Heap",
          "    let b = Box::new(5);",
          "    ",
          "    // 擁有權轉移 (Move) 給 c",
          "    let c = b;",
          "    ",
          "    // println!(\"{}\", b); // 錯誤！b 已失效",
          "} // c 被丟棄，Heap 上的資料隨之釋放"
        ],
        steps: [
          { line: 0, message: "程式開始。", stack: [], heap: [] },
          { line: 2, message: "呼叫 Box::new(5)。在 Heap 上分配記憶體存入 5，並在 Stack 建立指標 `b` 指向它。", stack: [{ name: 'b', type: 'Box', pointsTo: 'heap_1', valid: true }], heap: [{ id: 'heap_1', val: '5', refs: 1, type: 'data' }] },
          { line: 5, message: "將 b 賦值給 c。因為 Box 遵守擁有權規則，這會發生 Move (轉移)。b 失效，改由 c 掌管 Heap 上的資料。", stack: [{ name: 'b', type: 'Box', pointsTo: 'heap_1', valid: false }, { name: 'c', type: 'Box', pointsTo: 'heap_1', valid: true }], heap: [{ id: 'heap_1', val: '5', refs: 1, type: 'data' }] },
          { line: 7, message: "此時如果嘗試使用 b 會引發編譯錯誤，因為它的擁有權已經被轉移了。", stack: [{ name: 'b', type: 'Box', pointsTo: 'heap_1', valid: false }, { name: 'c', type: 'Box', pointsTo: 'heap_1', valid: true }], heap: [{ id: 'heap_1', val: '5', refs: 1, type: 'data' }] },
          { line: 8, message: "離開作用域，變數 c 被丟棄 (Drop)。因為 c 是 Heap 資料的唯一擁有者，Heap 上的記憶體也被安全釋放。", stack: [], heap: [] }
        ]
      },
      {
        id: 'rc',
        title: 'Rc<T>：單執行緒的多重擁有權',
        description: 'Rc (Reference Counted) 允許一個資料有多個擁有者。它會在 Heap 上維護一個「引用計數 (Strong Count)」。每 Clone 一次計數加 1，Drop 一次減 1。歸零時才釋放記憶體。',
        code: [
          "use std::rc::Rc;",
          "fn main() {",
          "    let r1 = Rc::new(String::from(\"共用資料\"));",
          "    let r2;",
          "    {",
          "        // 增加引用計數，不會複製底層資料",
          "        r2 = Rc::clone(&r1);",
          "    } // r2 離開作用域，計數減 1",
          "} // r1 離開作用域，計數歸零，釋放記憶體"
        ],
        steps: [
          { line: 1, message: "程式開始。", stack: [], heap: [] },
          { line: 2, message: "建立 Rc。Heap 上除了存放資料，還多了一個 Strong Count (目前為 1)。", stack: [{ name: 'r1', type: 'Rc', pointsTo: 'heap_rc', valid: true }], heap: [{ id: 'heap_rc', val: '"共用資料"', refs: 1, type: 'rc_data' }] },
          { line: 3, message: "宣告變數 r2。", stack: [{ name: 'r1', type: 'Rc', pointsTo: 'heap_rc', valid: true }, { name: 'r2', type: 'Rc', pointsTo: null, valid: false }], heap: [{ id: 'heap_rc', val: '"共用資料"', refs: 1, type: 'rc_data' }] },
          { line: 6, message: "呼叫 Rc::clone(&r1)。這不會複製字串本身！它只是讓 r2 也指向 Heap，並將 Heap 上的 Strong Count 加 1 變成 2。", stack: [{ name: 'r1', type: 'Rc', pointsTo: 'heap_rc', valid: true }, { name: 'r2', type: 'Rc', pointsTo: 'heap_rc', valid: true, isInner: true }], heap: [{ id: 'heap_rc', val: '"共用資料"', refs: 2, type: 'rc_data' }] },
          { line: 7, message: "內部作用域結束，r2 被丟棄。Heap 上的 Strong Count 減 1 變回 1。資料沒有被釋放，因為 r1 還在用！", stack: [{ name: 'r1', type: 'Rc', pointsTo: 'heap_rc', valid: true }], heap: [{ id: 'heap_rc', val: '"共用資料"', refs: 1, type: 'rc_data' }] },
          { line: 8, message: "main 結束，r1 被丟棄。Strong Count 減 1 變成 0。這時 Rc 知道已經沒有人需要它了，安全釋放 Heap 記憶體。", stack: [], heap: [] }
        ]
      },
      {
        id: 'arc',
        title: 'Arc<T>：多執行緒的安全共享',
        description: 'Arc (Atomic Reference Counted) 和 Rc 幾乎一樣，差別在於它的計數器使用了「原子操作 (Atomic)」，因此可以安全地跨越執行緒 (Thread) 分享，不會有 Data Race。',
        code: [
          "use std::sync::Arc;",
          "use std::thread;",
          "fn main() {",
          "    let arc1 = Arc::new(vec![1, 2, 3]);",
          "    let arc2 = Arc::clone(&arc1);",
          "    ",
          "    // 啟動新執行緒，並將 arc2 的擁有權 Move 進去",
          "    let handle = thread::spawn(move || {",
          "        println!(\"{:?}\", arc2);",
          "    }); // 執行緒結束，arc2 被丟棄，計數減 1",
          "    ",
          "    handle.join().unwrap();",
          "} // main 結束，arc1 被丟棄，計數歸零，釋放"
        ],
        steps: [
          { line: 2, message: "程式開始。", stack: [], heap: [] },
          { line: 3, message: "建立 Arc。在 Heap 上分配陣列，並建立具有 Atomic 特性的 Strong Count (目前為 1)。", stack: [{ name: 'arc1', type: 'Arc', pointsTo: 'heap_arc', valid: true, thread: 'main' }], heap: [{ id: 'heap_arc', val: '[1, 2, 3]', refs: 1, type: 'arc_data', isAtomic: true }] },
          { line: 4, message: "Clone Arc。Strong Count 安全地增加到 2。", stack: [{ name: 'arc1', type: 'Arc', pointsTo: 'heap_arc', valid: true, thread: 'main' }, { name: 'arc2', type: 'Arc', pointsTo: 'heap_arc', valid: true, thread: 'main' }], heap: [{ id: 'heap_arc', val: '[1, 2, 3]', refs: 2, type: 'arc_data', isAtomic: true }] },
          { line: 7, message: "啟動新執行緒！arc2 被 Move 到 Worker 執行緒的 Stack 中。跨執行緒共享達成！", stack: [{ name: 'arc1', type: 'Arc', pointsTo: 'heap_arc', valid: true, thread: 'main' }, { name: 'arc2', type: 'Arc', pointsTo: 'heap_arc', valid: true, thread: 'worker' }], heap: [{ id: 'heap_arc', val: '[1, 2, 3]', refs: 2, type: 'arc_data', isAtomic: true }] },
          { line: 9, message: "Worker 執行緒執行完畢。其 Stack 上的 arc2 被丟棄，Atomic Strong Count 安全減至 1。", stack: [{ name: 'arc1', type: 'Arc', pointsTo: 'heap_arc', valid: true, thread: 'main' }], heap: [{ id: 'heap_arc', val: '[1, 2, 3]', refs: 1, type: 'arc_data', isAtomic: true }] },
          { line: 12, message: "Main 執行緒結束。arc1 被丟棄，Atomic Strong Count 歸零，Heap 上的記憶體被釋放。", stack: [], heap: [] }
        ]
      }
    ];

    function RustSmartPointers() {
      const [activeScenarioIdx, setActiveScenarioIdx] = useState(0);
      const [currentStep, setCurrentStep] = useState(0);

      const scenario = SCENARIOS[activeScenarioIdx];
      const stepData = scenario.steps[currentStep];

      const handleNext = () => { if (currentStep < scenario.steps.length - 1) setCurrentStep(currentStep + 1); };
      const handlePrev = () => { if (currentStep > 0) setCurrentStep(currentStep - 1); };
      const handleReset = () => { setCurrentStep(0); };
      const handleScenarioChange = (idx) => { setActiveScenarioIdx(idx); setCurrentStep(0); };

      const getIcon = (type) => {
        switch(type) {
          case 'Box': return <Box size={16} className="text-amber-600" />;
          case 'Rc': return <Share2 size={16} className="text-blue-600" />;
          case 'Arc': return <Activity size={16} className="text-purple-600" />;
          default: return null;
        }
      };

      return (
        <div className="min-h-screen bg-[#f8fafc] font-sans text-slate-800">
          {/* 導覽列 */}
          <nav className="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 flex items-center h-14 gap-1">
              <a href="index.html" className="font-bold text-slate-800 mr-4 text-lg shrink-0 hover:text-orange-600">🦀 Rust 視覺化</a>
              <a href="rust01.html" className="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">借用檢查器</a>
              <a href="rust02.html" className="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">進階視覺化</a>
              <a href="rust03.html" className="px-4 py-2 rounded-lg text-sm font-medium bg-orange-600 text-white shadow">智慧指標</a>
            </div>
          </nav>

          <div className="p-4 md:p-8">
            <div className="max-w-6xl mx-auto space-y-6">
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h1 className="text-3xl font-bold text-slate-800 mb-2 flex items-center">
                  Rust 智慧指標
                  <span className="ml-3 px-3 py-1 bg-amber-100 text-amber-800 text-sm rounded-full">Box</span>
                  <span className="ml-2 px-3 py-1 bg-blue-100 text-blue-800 text-sm rounded-full">Rc</span>
                  <span className="ml-2 px-3 py-1 bg-purple-100 text-purple-800 text-sm rounded-full">Arc</span>
                </h1>
                <p className="text-slate-600 max-w-4xl mt-2">當標準的生命週期與單一擁有權無法滿足需求時，我們可以將資料放到 Heap 上，並透過智慧指標來管理它們的存活時間。</p>
                <div className="flex flex-wrap gap-2 mt-6">
                  {SCENARIOS.map((s, idx) => (
                    <button key={s.id} onClick={() => handleScenarioChange(idx)}
                      className={`px-5 py-2.5 rounded-lg text-sm font-semibold transition-all ${activeScenarioIdx === idx ? 'bg-slate-800 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}`}>
                      {s.title}
                    </button>
                  ))}
                </div>
              </div>

              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-start">
                <Play className="mr-3 mt-1 shrink-0 text-emerald-500" size={24} />
                <p className="text-lg font-medium text-slate-700 leading-relaxed">{stepData.message}</p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-1 bg-[#0f172a] rounded-2xl shadow-lg overflow-hidden flex flex-col border border-slate-800">
                  <div className="bg-[#1e293b] px-4 py-3 text-slate-300 text-sm font-mono flex items-center"><span>main.rs</span></div>
                  <div className="p-4 font-mono text-sm overflow-x-auto flex-1 leading-loose">
                    {scenario.code.map((line, idx) => (
                      <div key={idx} className={`flex px-2 py-0.5 rounded transition-colors ${stepData.line === idx ? 'bg-blue-900/50 border-l-4 border-blue-400' : 'border-l-4 border-transparent text-slate-400'}`}>
                        <span className="w-6 select-none opacity-40 text-right mr-3">{idx + 1}</span>
                        <span className={stepData.line === idx ? 'text-blue-50' : ''}>{line.replace(/ /g, "\u00A0")}</span>
                      </div>
                    ))}
                  </div>
                  <div className="bg-[#1e293b] p-4 flex justify-between border-t border-slate-700">
                    <button onClick={handlePrev} disabled={currentStep === 0} className="p-2 rounded-lg bg-slate-700 text-white disabled:opacity-30 transition-colors"><StepBack size={20} /></button>
                    <button onClick={handleReset} className="p-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-colors" title="重新開始"><RotateCcw size={20} /></button>
                    <button onClick={handleNext} disabled={currentStep === scenario.steps.length - 1} className="px-6 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white disabled:opacity-50 transition-colors flex items-center space-x-2 font-bold shadow-md">
                      <span>下一步</span><StepForward size={20} />
                    </button>
                  </div>
                </div>

                <div className="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <div className="bg-indigo-50 px-4 py-3 border-b border-indigo-100 flex items-center">
                      <Layers className="text-indigo-600 mr-2" size={18} />
                      <h2 className="font-bold text-indigo-900">Stack (堆疊)</h2>
                      <span className="ml-auto text-xs text-indigo-500 bg-indigo-100 px-2 py-1 rounded-full">指標儲存區</span>
                    </div>
                    <div className="p-4 flex-1 bg-slate-50 relative">
                      {stepData.stack.length === 0 ? (
                        <div className="flex h-full items-center justify-center text-slate-400 text-sm">Stack 為空</div>
                      ) : (
                        <div className="space-y-3">
                          {stepData.stack.map((item, i) => (
                            <div key={i} className={`p-3 rounded-xl border-2 transition-all ${!item.valid ? 'bg-slate-200 border-slate-300 opacity-50' : item.thread === 'worker' ? 'bg-teal-50 border-teal-300' : item.isInner ? 'bg-indigo-50 border-indigo-300 ml-6 relative' : 'bg-white border-indigo-300 shadow-sm'}`}>
                              {item.isInner && <div className="absolute -left-6 top-1/2 w-4 h-px bg-slate-400"></div>}
                              <div className="flex justify-between items-center mb-1">
                                <span className={`font-mono font-bold text-lg ${!item.valid ? 'text-slate-500 line-through' : 'text-slate-800'}`}>{item.name}</span>
                                {item.thread && <span className={`text-[10px] px-2 py-0.5 rounded uppercase font-bold ${item.thread === 'main' ? 'bg-blue-100 text-blue-700' : 'bg-teal-500 text-white'}`}>{item.thread} Thread</span>}
                              </div>
                              <div className="flex items-center text-sm">
                                <div className="flex items-center space-x-1 mr-3 bg-white/60 px-2 py-0.5 rounded border border-black/5">
                                  {getIcon(item.type)}
                                  <span className="font-semibold text-slate-600">{item.type} 指標</span>
                                </div>
                                {item.pointsTo && item.valid && <div className="flex items-center text-indigo-600"><ArrowRight size={14} className="mr-1" /><span className="font-mono text-xs">指向 Heap</span></div>}
                                {!item.valid && <span className="text-xs text-red-500 font-bold ml-2">已轉移/失效</span>}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <div className="bg-emerald-50 px-4 py-3 border-b border-emerald-100 flex items-center">
                      <Database className="text-emerald-600 mr-2" size={18} />
                      <h2 className="font-bold text-emerald-900">Heap (堆積)</h2>
                      <span className="ml-auto text-xs text-emerald-500 bg-emerald-100 px-2 py-1 rounded-full">實際資料區</span>
                    </div>
                    <div className="p-4 flex-1 bg-slate-50">
                      {stepData.heap.length === 0 ? (
                        <div className="flex h-full items-center justify-center text-slate-400 text-sm">Heap 為空</div>
                      ) : (
                        <div className="space-y-4 h-full flex flex-col justify-center">
                          {stepData.heap.map((item, i) => (
                            <div key={i} className={`p-4 rounded-xl border-2 shadow-sm ${item.type === 'rc_data' ? 'bg-blue-50 border-blue-300' : item.type === 'arc_data' ? 'bg-purple-50 border-purple-300' : 'bg-amber-50 border-amber-300'}`}>
                              {(item.type === 'rc_data' || item.type === 'arc_data') && (
                                <div className="flex justify-between items-center mb-3 pb-3 border-b border-black/10">
                                  <div className="flex items-center">
                                    {item.isAtomic ? <Activity size={16} className="text-purple-600 mr-2"/> : <Share2 size={16} className="text-blue-600 mr-2"/>}
                                    <span className="font-semibold text-sm text-slate-700">{item.isAtomic ? 'Atomic ' : ''}Strong Count</span>
                                  </div>
                                  <div className="bg-white border-2 border-slate-800 text-slate-800 font-bold text-lg w-8 h-8 rounded-full flex items-center justify-center shadow-inner">{item.refs}</div>
                                </div>
                              )}
                              <div className="text-center mt-2">
                                <span className="text-xs text-slate-500 block mb-1 uppercase tracking-widest font-bold">儲存的值</span>
                                <div className="font-mono text-xl text-slate-800 bg-white py-2 px-4 rounded-lg border border-black/5 inline-block shadow-sm">{item.val}</div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RustSmartPointers />);
  </script>
</body>
</html>
