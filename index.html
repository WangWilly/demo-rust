<head>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "lucide-react": "https://esm.sh/lucide-react@0.469.0"

  <script src="https://unpkg.com/@babel/standalone@7.27.1/babel.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      Play, StepForward, StepBack, RotateCcw,
      AlertTriangle, CheckCircle,
      Lock, Unlock, ShieldAlert,
      Box, Share2, Activity, Layers, Database, ArrowRight
    } from 'lucide-react';

    // ─────────────────────────────────────────────────────────────────────────
    // 模組一 (rust01.js)：Rust 借用檢查器與生命週期
    // ─────────────────────────────────────────────────────────────────────────
    const SCENARIOS_01 = [
      {
        id: 'invalid-borrow',
        title: '情境一：懸空引用 (編譯失敗)',
        description: '展示當引用的存活時間超過其指向的資料時，Rust 會如何阻擋編譯。',
        code: [
          "fn main() {",
          "    let r;",
          "    {",
          "        let x = 5;",
          "        r = &x;",
          "    } // x 在此被丟棄",
          "    println!(\"{}\", r);",
          "}"
        ],
        steps: [
          { line: 0, message: "程式開始執行。", memory: { outer: [], inner: null }, status: 'normal' },
          { line: 1, message: "宣告變數 `r`。它的生命週期涵蓋整個 main 函式，但尚未被初始化。", memory: { outer: [{ name: 'r', val: '未初始化', state: 'active' }], inner: null }, status: 'normal' },
          { line: 2, message: "開啟了一個新的內部作用域（Scope）。", memory: { outer: [{ name: 'r', val: '未初始化', state: 'active' }], inner: [] }, status: 'normal' },
          { line: 3, message: "在內部作用域宣告 `x` 並賦值為 5。`x` 是這個數值的擁有者。", memory: { outer: [{ name: 'r', val: '未初始化', state: 'active' }], inner: [{ name: 'x', val: '5', state: 'active' }] }, status: 'normal' },
          { line: 4, message: "借用發生！`r` 現在指向 `x`。Rust 的借用檢查器會記錄：r 的目標 (x) 必須活得比 r 還久。", memory: { outer: [{ name: 'r', val: '&x', state: 'active', pointsTo: 'x' }], inner: [{ name: 'x', val: '5', state: 'active' }] }, status: 'normal' },
          { line: 5, message: "內部作用域結束。變數 `x` 被丟棄（Dropped）。此時 `r` 變成了懸空引用（指向無效記憶體）。", memory: { outer: [{ name: 'r', val: '&x', state: 'error', pointsTo: 'x' }], inner: [{ name: 'x', val: '已丟棄 (Dropped)', state: 'dropped' }] }, status: 'error', errorMsg: "`x` 不夠長壽 (x does not live long enough)" },
          { line: 6, message: "編譯錯誤！嘗試使用無效的引用 `r`。借用檢查器在編譯階段就會擋下這段程式碼。", memory: { outer: [{ name: 'r', val: '&x', state: 'error', pointsTo: 'x' }], inner: [{ name: 'x', val: '已回收', state: 'dropped' }] }, status: 'error', errorMsg: "編譯失敗：borrowed value does not live long enough" }
        ]
      },
      {
        id: 'valid-borrow',
        title: '情境二：合法的借用 (編譯成功)',
        description: '展示資料的擁有者活得比引用還久的情境。',
        code: [
          "fn main() {",
          "    let x = 5;",
          "    let r = &x;",
          "    println!(\"{}\", r);",
          "}"
        ],
        steps: [
          { line: 0, message: "程式開始執行。", memory: { outer: [], inner: null }, status: 'normal' },
          { line: 1, message: "宣告變數 `x`，擁有數值 5。", memory: { outer: [{ name: 'x', val: '5', state: 'active' }], inner: null }, status: 'normal' },
          { line: 2, message: "宣告引用 `r`，指向 `x`。因為它們在同一個作用域，`x` 會在 `r` 之後才被丟棄，這是安全的。", memory: { outer: [{ name: 'x', val: '5', state: 'active' }, { name: 'r', val: '&x', state: 'active', pointsTo: 'x' }], inner: null }, status: 'normal' },
          { line: 3, message: "安全地印出 `r` 的值。此時 `x` 依然存活。", memory: { outer: [{ name: 'x', val: '5', state: 'active' }, { name: 'r', val: '&x', state: 'active', pointsTo: 'x' }], inner: null }, status: 'success' },
          { line: 4, message: "程式結束，`r` 和 `x` 依序被安全地丟棄。", memory: { outer: [], inner: null }, status: 'success' }
        ]
      },
      {
        id: 'explicit-lifetime',
        title: "情境三：顯式生命週期註記 'a",
        description: "當函式回傳引用時，編譯器需要知道回傳的引用和哪個輸入參數有相同的生命週期。",
        code: [
          "fn longest<'a>(x: &'a str, y: &'a str) -> &'a str {",
          "    if x.len() > y.len() { x } else { y }",
          "}",
          "fn main() {",
          "    let s1 = String::from(\"long\");",
          "    let result;",
          "    {",
          "        let s2 = String::from(\"xyz\");",
          "        result = longest(&s1, &s2);",
          "    } // s2 被丟棄",
          "    println!(\"{}\", result); // 錯誤！",
          "}"
        ],
        steps: [
          { line: 0, message: "標記 <'a> 告訴編譯器：回傳的字串引用，其生命週期將等於 x 和 y 兩者生命週期的「交集」（取較短的那個）。", memory: { outer: [], inner: null }, status: 'normal' },
          { line: 4, message: "進入 main 函式。創建字串 `s1`。", memory: { outer: [{name: 's1', val: '"long"', state: 'active'}], inner: null }, status: 'normal' },
          { line: 5, message: "宣告 `result` 準備接收最長的字串引用。", memory: { outer: [{name: 's1', val: '"long"', state: 'active'}, {name: 'result', val: '未初始化', state: 'active'}], inner: null }, status: 'normal' },
          { line: 6, message: "進入內部作用域。", memory: { outer: [{name: 's1', val: '"long"', state: 'active'}, {name: 'result', val: '未初始化', state: 'active'}], inner: [] }, status: 'normal' },
          { line: 7, message: "創建字串 `s2`。", memory: { outer: [{name: 's1', val: '"long"', state: 'active'}, {name: 'result', val: '未初始化', state: 'active'}], inner: [{name: 's2', val: '"xyz"', state: 'active'}] }, status: 'normal' },
          { line: 8, message: "呼叫 longest。根據 'a 規則，回傳值 result 的生命週期被限制為 s1 和 s2 兩者較短的那個，也就是 s2 的生命週期。", memory: { outer: [{name: 's1', val: '"long"', state: 'active'}, {name: 'result', val: '&s1 或 &s2', state: 'active', pointsTo: 's2'}], inner: [{name: 's2', val: '"xyz"', state: 'active'}] }, status: 'normal' },

          { line: 10, message: "嘗試印出 result 會導致編譯失敗，因為編譯器認為 result 可能指向已經死掉的 s2。", memory: { outer: [{name: 's1', val: '"long"', state: 'active'}, {name: 'result', val: '懸空引用', state: 'error'}], inner: [{name: 's2', val: '已丟棄', state: 'dropped'}] }, status: 'error', errorMsg: "編譯失敗！" }
        ]
      }
    ];

    function BorrowChecker() {
      const [activeScenarioIdx, setActiveScenarioIdx] = useState(0);
      const [currentStep, setCurrentStep] = useState(0);

      const scenario = SCENARIOS_01[activeScenarioIdx];
      const stepData = scenario.steps[currentStep];

      const handleNext = () => { if (currentStep < scenario.steps.length - 1) setCurrentStep(currentStep + 1); };
      const handlePrev = () => { if (currentStep > 0) setCurrentStep(currentStep - 1); };
      const handleReset = () => { setCurrentStep(0); };
      const handleScenarioChange = (idx) => { setActiveScenarioIdx(idx); setCurrentStep(0); };

      const renderVar = (v, idx) => (
        <div key={idx} className={`p-3 rounded-md mb-2 flex items-center justify-between border-2 transition-all ${
          v.state === 'active' ? 'bg-blue-50 border-blue-200 text-blue-800' :
          v.state === 'error' ? 'bg-red-50 border-red-400 text-red-800 animate-pulse' :
          'bg-gray-100 border-gray-300 text-gray-500 opacity-60'
        }`}>
          <div className="flex flex-col">
            <span className="font-mono font-bold text-lg">{v.name}</span>
            <span className="text-sm">{v.state === 'active' && !v.pointsTo ? '擁有人 (Owner)' : (v.pointsTo ? '引用 (Reference)' : '已丟棄')}</span>
          </div>
          <div className="flex items-center space-x-2">
            {v.pointsTo && (
              <div className="flex items-center text-gray-400">
                <span className="mr-1">指向</span>
                <span className={`font-mono font-bold ${v.state === 'error' ? 'text-red-500 line-through' : 'text-blue-600'}`}>{v.pointsTo}</span>
              </div>
            )}
            <div className={`px-3 py-1 rounded font-mono text-sm ${v.state === 'error' ? 'bg-red-200' : 'bg-white shadow-sm'}`}>{v.val}</div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-gray-50 p-4 md:p-8 font-sans text-gray-800">
          <div className="max-w-5xl mx-auto space-y-6">
            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
              <h1 className="text-3xl font-bold text-gray-900 mb-2">Rust 借用檢查器與生命週期</h1>
              <p className="text-gray-600">透過視覺化單步執行，理解 Rust 是如何在編譯階段阻止懸空引用的。</p>
              <div className="flex flex-wrap gap-2 mt-4">
                {SCENARIOS_01.map((s, idx) => (
                  <button key={s.id} onClick={() => handleScenarioChange(idx)}
                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${activeScenarioIdx === idx ? 'bg-orange-600 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                    {s.title}
                  </button>
                ))}
              </div>
              <p className="mt-4 text-sm text-gray-500 bg-gray-50 p-3 rounded border border-gray-100">{scenario.description}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div className="bg-[#1e1e1e] rounded-xl shadow-sm overflow-hidden border border-gray-800 flex flex-col">
                <div className="bg-[#2d2d2d] px-4 py-2 text-gray-300 text-sm font-mono flex items-center"><span>main.rs</span></div>
                <div className="p-4 font-mono text-sm sm:text-base overflow-x-auto flex-1">
                  {scenario.code.map((line, idx) => (
                    <div key={idx} className={`flex px-2 py-1 rounded transition-colors ${stepData.line === idx ? 'bg-blue-900/50 border-l-4 border-blue-400' : 'border-l-4 border-transparent text-gray-400'}`}>
                      <span className="w-8 select-none opacity-50 text-right mr-4">{idx + 1}</span>
                      <span className={stepData.line === idx ? 'text-blue-100' : ''}>{line.replace(/ /g, "\u00A0")}</span>
                    </div>
                  ))}
                </div>
                <div className="bg-[#2d2d2d] p-4 flex items-center justify-between border-t border-gray-700">
                  <div className="text-gray-400 text-sm">Step {currentStep + 1} / {scenario.steps.length}</div>
                  <div className="flex space-x-2">
                    <button onClick={handleReset} className="p-2 rounded hover:bg-gray-600 text-gray-300 transition-colors" title="重置"><RotateCcw size={20} /></button>
                    <button onClick={handlePrev} disabled={currentStep === 0} className="p-2 rounded hover:bg-gray-600 text-gray-300 disabled:opacity-30 transition-colors" title="上一步"><StepBack size={20} /></button>
                    <button onClick={handleNext} disabled={currentStep === scenario.steps.length - 1} className="p-2 rounded bg-blue-600 hover:bg-blue-500 text-white disabled:opacity-50 transition-colors flex items-center space-x-1">
                      <span>下一步</span><StepForward size={20} />
                    </button>
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
                <div className="bg-gray-50 px-4 py-3 border-b border-gray-200">
                  <h2 className="font-semibold text-gray-700">編譯器視角 (Borrow Checker)</h2>
                </div>
                <div className="p-5 flex-1 overflow-y-auto">
                  <div className={`p-4 rounded-lg mb-6 border ${stepData.status === 'error' ? 'bg-red-50 border-red-200 text-red-800' : stepData.status === 'success' ? 'bg-green-50 border-green-200 text-green-800' : 'bg-blue-50 border-blue-200 text-blue-800'}`}>
                    <div className="flex items-start">
                      {stepData.status === 'error' ? <AlertTriangle className="mr-2 mt-0.5 shrink-0" size={20} /> : stepData.status === 'success' ? <CheckCircle className="mr-2 mt-0.5 shrink-0" size={20} /> : <Play className="mr-2 mt-0.5 shrink-0" size={20} />}
                      <div>
                        <p className="font-medium">{stepData.message}</p>
                        {stepData.errorMsg && <p className="mt-2 font-mono text-sm bg-red-100 p-2 rounded text-red-900 border border-red-200">{stepData.errorMsg}</p>}
                      </div>
                    </div>
                  </div>
                  <div className="space-y-4">
                    <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider">作用域與記憶體狀態</h3>
                    <div className="border-2 border-gray-300 rounded-lg p-4 relative">
                      <div className="absolute -top-3 left-4 bg-white px-2 text-xs font-bold text-gray-500">Main 作用域 ('a)</div>
                      {stepData.memory.outer.length === 0 && !stepData.memory.inner && <div className="text-gray-400 text-center py-4 text-sm">尚未分配變數</div>}
                      {stepData.memory.outer.map((v, i) => renderVar(v, i))}
                      {stepData.memory.inner !== null && (
                        <div className="border-2 border-dashed border-gray-400 bg-gray-50 rounded-lg p-4 mt-4 relative">
                          <div className="absolute -top-3 left-4 bg-gray-50 px-2 text-xs font-bold text-gray-500">內部作用域 ('b)</div>
                          {stepData.memory.inner.length === 0 && <div className="text-gray-400 text-center py-2 text-sm">無變數</div>}
                          {stepData.memory.inner.map((v, i) => renderVar(v, i))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────
    // 模組二 (rust02.js)：借用檢查器進階視覺化
    // ─────────────────────────────────────────────────────────────────────────
    const SCENARIOS_02 = [
      {
        id: 'struct-lifetime',
        title: '進階一：結構體中的生命週期',
        description: '當 Struct 儲存引用時，必須宣告生命週期參數，告訴編譯器「這個 Struct 實例的存活時間，絕對不能超過它所持有的引用」。',
        code: [
          "struct Excerpt<'a> {",
          "    part: &'a str,",
          "}",
          "fn main() {",
          "    let i;",
          "    {",
          "        let text = String::from(\"Rust\");",
          "        i = Excerpt { part: &text };",
          "    } // text 在此被丟棄",
          "    println!(\"{}\", i.part);",
          "}"
        ],
        steps: [
          { line: 0, message: "宣告 Struct。<'a> 標示了這個結構體持有引用的生命週期。", memory: { outer: [], inner: null } },
          { line: 4, message: "宣告變數 `i`，準備用來存放 Excerpt 實例。", memory: { outer: [{ name: 'i', val: '未初始化', state: 'active', type: 'struct' }], inner: null } },
          { line: 5, message: "開啟內部作用域。", memory: { outer: [{ name: 'i', val: '未初始化', state: 'active', type: 'struct' }], inner: [] } },
          { line: 6, message: "創建字串 `text`。", memory: { outer: [{ name: 'i', val: '未初始化', state: 'active', type: 'struct' }], inner: [{ name: 'text', val: '"Rust"', state: 'active', type: 'owner' }] } },
          { line: 7, message: "創建 Excerpt 實例。此時 i.part 借用了 text。編譯器記錄：i 的生命週期被限制在 text 的生命週期內。", memory: { outer: [{ name: 'i', val: 'Excerpt { part: &text }', state: 'active', type: 'struct', pointsTo: 'text' }], inner: [{ name: 'text', val: '"Rust"', state: 'active', type: 'owner', locks: { read: 1, write: 0 } }] } },
          { line: 8, message: "內部作用域結束，`text` 被丟棄。但 `i` 仍然存活，導致 `i` 內部包含了一個懸空引用！", status: 'error', errorMsg: "`text` 不夠長壽", memory: { outer: [{ name: 'i', val: 'Excerpt { part: 懸空引用 }', state: 'error', type: 'struct', pointsTo: 'text' }], inner: [{ name: 'text', val: '已丟棄', state: 'dropped', type: 'owner' }] } },
          { line: 9, message: "編譯失敗！嘗試存取無效的引用 `i.part`。", status: 'error', memory: { outer: [{ name: 'i', val: 'Excerpt { part: 懸空引用 }', state: 'error', type: 'struct', pointsTo: 'text' }], inner: [{ name: 'text', val: '已回收', state: 'dropped', type: 'owner' }] } }
        ]
      },
      {
        id: 'borrow-conflict',
        title: '進階二：借用衝突 (讀寫互斥)',
        description: 'Rust 借用規則：「在任何給定的時間點，你可以擁有任意數量的不可變引用(&)，或剛好一個可變引用(&mut)，但不能同時擁有兩者」。這被稱為 Aliasing XOR Mutation。',
        code: [
          "fn main() {",
          "    let mut s = String::from(\"hello\");",
          "    let r1 = &s; // 不可變借用",
          "    let r2 = &s; // 不可變借用",
          "    let r3 = &mut s; // 可變借用 (衝突！)",
          "    println!(\"{}, {}, {}\", r1, r2, r3);",
          "}"
        ],
        steps: [
          { line: 0, message: "程式開始。", memory: { outer: [], inner: null } },
          { line: 1, message: "宣告可變變數 `s`，擁有字串的擁有權。", memory: { outer: [{ name: 's', val: '"hello"', state: 'active', type: 'owner', locks: { read: 0, write: 0 }, isMut: true }], inner: null } },
          { line: 2, message: "宣告不可變引用 `r1`。`s` 被加上了 1 個「讀取鎖」。", memory: { outer: [{ name: 's', val: '"hello"', state: 'active', type: 'owner', locks: { read: 1, write: 0 }, isMut: true }, { name: 'r1', val: '&s', state: 'active', type: 'immut_ref', pointsTo: 's' }], inner: null } },
          { line: 3, message: "宣告不可變引用 `r2`。多個讀取是安全的，`s` 現在有 2 個「讀取鎖」。", memory: { outer: [{ name: 's', val: '"hello"', state: 'active', type: 'owner', locks: { read: 2, write: 0 }, isMut: true }, { name: 'r1', val: '&s', state: 'active', type: 'immut_ref', pointsTo: 's' }, { name: 'r2', val: '&s', state: 'active', type: 'immut_ref', pointsTo: 's' }], inner: null } },
          { line: 4, message: "宣告可變引用 `r3` 嘗試獲取「寫入鎖」。失敗！因為 `s` 身上還有未釋放的讀取鎖（r1, r2 稍後還會用到）。", status: 'error', errorMsg: "cannot borrow `s` as mutable because it is also borrowed as immutable", memory: { outer: [{ name: 's', val: '"hello"', state: 'error', type: 'owner', locks: { read: 2, write: '拒絕' }, isMut: true }, { name: 'r1', val: '&s', state: 'active', type: 'immut_ref', pointsTo: 's' }, { name: 'r2', val: '&s', state: 'active', type: 'immut_ref', pointsTo: 's' }, { name: 'r3', val: '&mut s (失敗)', state: 'error', type: 'mut_ref', pointsTo: 's' }], inner: null } },
          { line: 5, message: "編譯階段被借用檢查器擋下。", status: 'error', memory: { outer: [{ name: 's', val: '"hello"', state: 'error', type: 'owner', locks: { read: 2, write: '拒絕' }, isMut: true }, { name: 'r1', val: '&s', state: 'active', type: 'immut_ref', pointsTo: 's' }, { name: 'r2', val: '&s', state: 'active', type: 'immut_ref', pointsTo: 's' }, { name: 'r3', val: '&mut s', state: 'error', type: 'mut_ref', pointsTo: 's' }], inner: null } }
        ]
      },
      {
        id: 'nll',
        title: '進階三：非詞法生命週期 (NLL)',
        description: '在現代 Rust 中，引用的生命週期不再死板地跟隨大括號結束。如果一個引用「最後一次被使用」的地方提早結束，編譯器會提早釋放它的鎖。',
        code: [
          "fn main() {",
          "    let mut s = String::from(\"hello\");",
          "    let r1 = &s; // 不可變借用",
          "    println!(\"{}\", r1);",
          "    // --- NLL: r1 之後再也沒被使用 ---",
          "    let r2 = &mut s; // 可變借用 (成功！)",
          "    r2.push_str(\" world\");",

    // ─────────────────────────────────────────────────────────────────────────

    const SCENARIOS_03 = [

        <div className="min-h-screen bg-[#f8fafc] p-4 md:p-8 font-sans text-slate-800">
          <div className="max-w-6xl mx-auto space-y-6">
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
              <h1 className="text-3xl font-bold text-slate-800 mb-2 flex items-center">
                Rust 智慧指標
                <span className="ml-3 px-3 py-1 bg-amber-100 text-amber-800 text-sm rounded-full">Box</span>
                <span className="ml-2 px-3 py-1 bg-blue-100 text-blue-800 text-sm rounded-full">Rc</span>
                <span className="ml-2 px-3 py-1 bg-purple-100 text-purple-800 text-sm rounded-full">Arc</span>
              </h1>
              <p className="text-slate-600 max-w-4xl mt-2">當標準的生命週期與單一擁有權無法滿足需求時，我們可以將資料放到 Heap 上，並透過智慧指標來管理它們的存活時間。</p>
              <div className="flex flex-wrap gap-2 mt-6">
                {SCENARIOS_03.map((s, idx) => (
                  <button key={s.id} onClick={() => handleScenarioChange(idx)}
                    className={`px-5 py-2.5 rounded-lg text-sm font-semibold transition-all ${activeScenarioIdx === idx ? 'bg-slate-800 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}`}>
                    {s.title}
                  </button>
                ))}
              </div>
            </div>

            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-start">
              <Play className="mr-3 mt-1 shrink-0 text-emerald-500 fill-emerald-100" size={24} />
              <p className="text-lg font-medium text-slate-700 leading-relaxed">{stepData.message}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-1 bg-[#0f172a] rounded-2xl shadow-lg overflow-hidden flex flex-col border border-slate-800">
                <div className="bg-[#1e293b] px-4 py-3 text-slate-300 text-sm font-mono flex items-center"><span>main.rs</span></div>
                <div className="p-4 font-mono text-sm overflow-x-auto flex-1 leading-loose">
                  {scenario.code.map((line, idx) => (
                    <div key={idx} className={`flex px-2 py-0.5 rounded transition-colors ${stepData.line === idx ? 'bg-blue-900/50 border-l-4 border-blue-400' : 'border-l-4 border-transparent text-slate-400'}`}>
                      <span className="w-6 select-none opacity-40 text-right mr-3">{idx + 1}</span>
                      <span className={stepData.line === idx ? 'text-blue-50' : ''}>{line.replace(/ /g, "\u00A0")}</span>
                    </div>
                  ))}
                </div>
                <div className="bg-[#1e293b] p-4 flex justify-between border-t border-slate-700">
                  <button onClick={handlePrev} disabled={currentStep === 0} className="p-2 rounded-lg bg-slate-700 text-white disabled:opacity-30 transition-colors"><StepBack size={20} /></button>
                  <button onClick={handleReset} className="p-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-colors" title="重新開始"><RotateCcw size={20} /></button>
                  <button onClick={handleNext} disabled={currentStep === scenario.steps.length - 1} className="px-6 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white disabled:opacity-50 transition-colors flex items-center space-x-2 font-bold shadow-md">
                    <span>下一步</span><StepForward size={20} />
                  </button>
                </div>
              </div>

              <div className="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                  <div className="bg-indigo-50 px-4 py-3 border-b border-indigo-100 flex items-center">
                    <Layers className="text-indigo-600 mr-2" size={18} />
                    <h2 className="font-bold text-indigo-900">Stack (堆疊)</h2>
                    <span className="ml-auto text-xs text-indigo-500 bg-indigo-100 px-2 py-1 rounded-full">指標儲存區</span>
                  </div>
                  <div className="p-4 flex-1 bg-slate-50 relative">
                    {stepData.stack.length === 0 ? (
                      <div className="flex h-full items-center justify-center text-slate-400 text-sm">Stack 為空</div>
                    ) : (
                      <div className="space-y-3">
                        {stepData.stack.map((item, i) => (
                          <div key={i} className={`p-3 rounded-xl border-2 transition-all ${!item.valid ? 'bg-slate-200 border-slate-300 opacity-50' : item.thread === 'worker' ? 'bg-teal-50 border-teal-300' : item.isInner ? 'bg-indigo-50 border-indigo-300 ml-6 relative' : 'bg-white border-indigo-300 shadow-sm'}`}>
                            {item.isInner && <div className="absolute -left-6 top-1/2 w-4 h-px bg-slate-400"></div>}
                            <div className="flex justify-between items-center mb-1">
                              <span className={`font-mono font-bold text-lg ${!item.valid ? 'text-slate-500 line-through' : 'text-slate-800'}`}>{item.name}</span>
                              {item.thread && <span className={`text-[10px] px-2 py-0.5 rounded uppercase font-bold ${item.thread === 'main' ? 'bg-blue-100 text-blue-700' : 'bg-teal-500 text-white'}`}>{item.thread} Thread</span>}
                            </div>
                            <div className="flex items-center text-sm">
                              <div className="flex items-center space-x-1 mr-3 bg-white/60 px-2 py-0.5 rounded border border-black/5">
                                {getIcon(item.type)}
                                <span className="font-semibold text-slate-600">{item.type} 指標</span>
                              </div>
                              {item.pointsTo && item.valid && <div className="flex items-center text-indigo-600"><ArrowRight size={14} className="mr-1" /><span className="font-mono text-xs">指向 Heap</span></div>}
                              {!item.valid && <span className="text-xs text-red-500 font-bold ml-2">已轉移/失效</span>}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                  <div className="bg-emerald-50 px-4 py-3 border-b border-emerald-100 flex items-center">
                    <Database className="text-emerald-600 mr-2" size={18} />
                    <h2 className="font-bold text-emerald-900">Heap (堆積)</h2>
                    <span className="ml-auto text-xs text-emerald-500 bg-emerald-100 px-2 py-1 rounded-full">實際資料區</span>
                  </div>
                  <div className="p-4 flex-1 bg-slate-50">
                    {stepData.heap.length === 0 ? (
                      <div className="flex h-full items-center justify-center text-slate-400 text-sm">Heap 為空</div>
                    ) : (
                      <div className="space-y-4 h-full flex flex-col justify-center">
                        {stepData.heap.map((item, i) => (
                          <div key={i} className={`p-4 rounded-xl border-2 shadow-sm ${item.type === 'rc_data' ? 'bg-blue-50 border-blue-300' : item.type === 'arc_data' ? 'bg-purple-50 border-purple-300' : 'bg-amber-50 border-amber-300'}`}>
                            {(item.type === 'rc_data' || item.type === 'arc_data') && (
                              <div className="flex justify-between items-center mb-3 pb-3 border-b border-black/10">
                                <div className="flex items-center">
                                  {item.isAtomic ? <Activity size={16} className="text-purple-600 mr-2"/> : <Share2 size={16} className="text-blue-600 mr-2"/>}
                                  <span className="font-semibold text-sm text-slate-700">{item.isAtomic ? 'Atomic ' : ''}Strong Count</span>
                                </div>
                                <div className="bg-white border-2 border-slate-800 text-slate-800 font-bold text-lg w-8 h-8 rounded-full flex items-center justify-center shadow-inner">{item.refs}</div>
                              </div>
                            )}
                            <div className="text-center mt-2">
                              <span className="text-xs text-slate-500 block mb-1 uppercase tracking-widest font-bold">儲存的值</span>
                              <div className="font-mono text-xl text-slate-800 bg-white py-2 px-4 rounded-lg border border-black/5 inline-block shadow-sm">{item.val}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────
    // 主 App：頁籤導覽
    // ─────────────────────────────────────────────────────────────────────────
    const TABS = [
      { id: 'borrow',   label: '借用檢查器與生命週期',      component: BorrowChecker },
      { id: 'advanced', label: '借用檢查器進階視覺化',       component: AdvancedRustLifetimes },
      { id: 'smart',    label: '智慧指標 Box / Rc / Arc', component: RustSmartPointers },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState(0);
      const ActiveComponent = TABS[activeTab].component;

      return (
        <div>
          {/* 頂部導覽列 */}
          <nav className="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 flex items-center h-14 gap-1">
              <span className="font-bold text-slate-800 mr-4 text-lg shrink-0">🦀 Rust 視覺化</span>
              {TABS.map((tab, idx) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(idx)}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap ${
                    activeTab === idx
                      ? 'bg-orange-600 text-white shadow'
                      : 'text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </nav>

          {/* 頁面內容 */}
          <ActiveComponent />
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
